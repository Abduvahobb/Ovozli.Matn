                              android:color="#4338CA"
                              android:offset="1.0" />
                      </gradient>
                  </aapt:attr>
              </path>
              <path
                  android:fillColor="#1FFFFFFF"
                  android:pathData="M46,10a50,50 0 1,0 100,0a50,50 0 1,0 -100,0z" />
              <path
                  android:fillColor="#14FFFFFF"
                  android:pathData="M-34,100a46,46 0 1,0 92,0a46,46 0 1,0 -92,0z" />
          </vector>
          EOF_ICBG

          cat > src/main/res/drawable/ic_launcher_foreground.xml <<'EOF_ICFG'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <group
                  android:scaleX="1.7"
                  android:scaleY="1.7"
                  android:translateX="33.6"
                  android:translateY="33.6">
                  <path
                      android:fillColor="#FFFFFF"
                      android:pathData="M12,14c1.66,0 3,-1.34 3,-3V5c0,-1.66 -1.34,-3 -3,-3S9,3.34 9,5v6c0,1.66 1.34,3 3,3z" />
                  <path
                      android:fillColor="#FFFFFF"
                      android:pathData="M17.3,11c0,3 -2.54,5.1 -5.3,5.1S6.7,14 6.7,11H5c0,3.41 2.72,6.23 6,6.72V21h2v-3.28c3.28,-0.48 6,-3.3 6,-6.72h-1.7z" />
              </group>
              <path
                  android:pathData="M36,42a14,14 0 0,0 0,12"
                  android:strokeColor="#FFFFFF"
                  android:strokeAlpha="0.95"
                  android:strokeLineCap="round"
                  android:strokeWidth="3.6" />
              <path
                  android:pathData="M72,42a14,14 0 0,1 0,12"
                  android:strokeColor="#FFFFFF"
                  android:strokeAlpha="0.95"
                  android:strokeLineCap="round"
                  android:strokeWidth="3.6" />
              <path
                  android:pathData="M29,36a22,22 0 0,0 0,24"
                  android:strokeColor="#FFFFFF"
                  android:strokeAlpha="0.55"
                  android:strokeLineCap="round"
                  android:strokeWidth="3.6" />
              <path
                  android:pathData="M79,36a22,22 0 0,1 0,24"
                  android:strokeColor="#FFFFFF"
                  android:strokeAlpha="0.55"
